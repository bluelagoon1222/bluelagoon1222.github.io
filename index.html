<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SJ Market Desk — 투자 도구 모음</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B2D5B'/><text x='50' y='68' font-size='50' font-weight='800' font-family='Arial' fill='%23F37321' text-anchor='middle'>SJ</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F37321; --navy:#0B2D5B; --ink:#1B2230; --sub:#5B6475;
  --line:#E3E6EB; --bg:#FFFFFF; --band:#F4F6F9; --hover:#FFF4EC;
  --side:#0B2D5B; --side-ink:#DCE5F2; --side-sub:#8FA3C0; --side-hover:#143E75;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#9CC2F2; --ink:#E8ECF2; --sub:#A3ACBB; --line:#2A3242;
    --bg:#121722; --band:#1A2130; --hover:#2A2118; --side:#0A1222; --side-hover:#18233A;
  }
}
:root[data-theme="dark"]{
  --navy:#9CC2F2; --ink:#E8ECF2; --sub:#A3ACBB; --line:#2A3242;
  --bg:#121722; --band:#1A2130; --hover:#2A2118; --side:#0A1222; --side-hover:#18233A;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Nanum Gothic","나눔고딕","Dotum","돋움","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
[hidden]{display:none!important}

/* ===== 홈 화면 ===== */
#home{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.sj{color:var(--orange)}
/* ===== 헤더 (히어로) ===== */
.hero{position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(900px 420px at 88% -10%,rgba(243,115,33,.30),transparent 60%),
             radial-gradient(700px 500px at -10% 120%,rgba(60,120,210,.25),transparent 60%),
             linear-gradient(160deg,#0D3166 0%,#081F42 55%,#050F22 100%)}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-bg .grid{stroke:rgba(255,255,255,.06);stroke-width:1}
.hero-bg .line{fill:none;stroke:var(--orange);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(243,115,33,.6));
  stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 2.4s .2s cubic-bezier(.4,0,.2,1) forwards}
.hero-bg .area{fill:url(#ga);opacity:0;animation:fade 1.2s 1.6s forwards}
.hero-bg .dot{fill:var(--orange);opacity:0;animation:fade .4s 2.5s forwards}
.hero-bg .ring{fill:none;stroke:var(--orange);stroke-width:2;opacity:0;transform-origin:center;transform-box:fill-box;animation:pulse 2.4s 2.6s ease-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.hero-in{position:relative;padding-top:42px;padding-bottom:28px}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.28em;color:#F7A267;text-transform:uppercase}
.eyebrow::before{content:"";width:36px;height:2px;background:var(--orange)}
.hero h1{margin:12px 0 0;font-size:clamp(36px,5.2vw,64px);font-weight:800;line-height:.95;letter-spacing:-0.035em;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.35)}
.hero h1 .sj{color:var(--orange)}
.hero .lead{margin:12px 0 0;font-size:17px;word-break:keep-all;color:#C9D6EA;letter-spacing:-0.01em}
.hero .lead b{color:#fff;font-weight:700}
.stats{display:flex;flex-wrap:wrap;margin:24px 0 0;padding:0;list-style:none;border-top:1px solid rgba(255,255,255,.14)}
.stats li{padding:12px 26px 0 0;margin-right:26px;border-right:1px solid rgba(255,255,255,.14)}
.stats li:last-child{border-right:0;margin-right:0}
.stats .k{display:block;font-size:11px;letter-spacing:.18em;color:#8FA3C0;text-transform:uppercase}
.stats .v{display:block;margin-top:4px;font-size:20px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.stats .v small{font-size:13px;font-weight:700;color:#C9D6EA;margin-left:4px}
.stats .v.o{color:var(--orange)}
.searchrow{margin-top:20px;max-width:460px;position:relative}
.searchrow svg{position:absolute;left:16px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:#C9D6EA;z-index:1}
.search{width:100%;padding:11px 14px 11px 44px;font:inherit;font-size:16px;color:#fff;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:10px;backdrop-filter:blur(6px)}
.search::placeholder{color:#9FB0C8}
.search:focus{outline:none;border-color:var(--orange);background:rgba(255,255,255,.12)}
.hero-edge{height:4px;background:linear-gradient(90deg,var(--orange),#FFB27A 60%,var(--orange))}
@media (prefers-reduced-motion:reduce){.hero-bg .line{animation:none;stroke-dashoffset:0}.hero-bg .area,.hero-bg .dot{animation:none;opacity:1}.hero-bg .ring{animation:none}}

section{padding:40px 0 8px}
.group-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.group-head h2{margin:0;font-size:24px;font-weight:800;color:var(--navy)}
.group-head span{font-size:16px;color:var(--sub)}
.list{border-top:2px solid var(--navy)}
a.site{display:grid;grid-template-columns:320px 1fr 150px;gap:20px;align-items:center;padding:20px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;position:relative}
a.site::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--orange);transition:width .15s}
a.site:hover,a.site:focus-visible{background:var(--hover);outline:none}
a.site:hover::before,a.site:focus-visible::before{width:5px}
.name{font-size:20px;font-weight:800;color:var(--ink);line-height:1.3}
.name .ico{margin-right:8px}
.repo{display:block;font-size:14px;font-weight:400;color:var(--sub);margin-top:4px;word-break:break-all}
.desc{font-size:17px;word-break:keep-all}
.when{font-size:15px;color:var(--sub);text-align:right}
.when strong{display:block;color:var(--orange);font-weight:700}
.empty{display:none;padding:40px 0;font-size:18px;color:var(--sub)}
footer{margin-top:48px;padding:28px 0 40px;background:var(--band);font-size:15px;color:var(--sub)}
footer p{margin:4px 0}

/* ===== 사이트 보기 화면 (왼쪽 메뉴 + 오른쪽 사이트) ===== */
#app{position:fixed;inset:0;display:flex;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--side)}
#side{width:256px;flex:0 0 256px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;overflow-y:auto;transition:width .15s,flex-basis .15s}
#side a,#side button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 16px;color:var(--side-ink);text-decoration:none;font:inherit;font-size:15px;background:none;border:0;cursor:pointer;text-align:left;border-left:4px solid transparent;white-space:nowrap}
#side a:hover,#side button:hover,#side a:focus-visible,#side button:focus-visible{background:var(--side-hover);outline:none}
#side .ico{flex:0 0 26px;width:26px;text-align:center;font-size:19px;line-height:1}
#side .lbl{overflow:hidden;text-overflow:ellipsis}
#side .homebtn{padding:16px;font-size:17px;font-weight:800;border-bottom:1px solid var(--side-hover)}
#side .homebtn svg{width:24px;height:24px;flex:0 0 26px}
#side .gname{padding:16px 20px 6px;font-size:13px;color:var(--side-sub)}
#side a.on{border-left-color:var(--orange);background:var(--side-hover);color:#fff;font-weight:700}
#side .bottom{margin-top:auto;border-top:1px solid var(--side-hover);padding:6px 0}
#side .bottom a,#side .bottom button{font-size:14px;color:var(--side-sub)}
body.mini #side{width:66px;flex-basis:66px}
body.mini #side .lbl,body.mini #side .gname{display:none}
body.mini #side .gsep{display:block}
#side .gsep{display:none;height:1px;margin:8px 14px;background:var(--side-hover)}
.view{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.mbar{display:none}
#fr{flex:1;width:100%;border:0;background:var(--bg)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--sub);pointer-events:none}
.view{position:relative}

@media (max-width:820px){
  .wrap{padding:0 20px}
  .hero-in{padding-top:30px;padding-bottom:22px}
  .eyebrow{font-size:11px;letter-spacing:.2em;gap:10px}
  .eyebrow::before{width:24px}
  .hero h1{margin-top:10px;font-size:36px}
  .hero .lead{font-size:15px;margin-top:10px}
  .stats{margin-top:18px}
  .stats li{padding:10px 16px 0 0;margin-right:16px}
  .stats .v{font-size:18px}
  .stats .v small{font-size:13px}
  .stats li.clock{flex-basis:100%;border-right:0;margin-right:0}
  .stats li:nth-child(2){border-right:0}
  .searchrow{margin-top:16px;max-width:none}
  .search{font-size:15px;padding:10px 12px 10px 40px}
  section{padding:28px 0 4px}
  .group-head h2{font-size:21px}
  .group-head span{font-size:14px}
  .name{font-size:19px}
  .desc{font-size:15.5px}
  a.site{grid-template-columns:1fr;gap:6px;padding:18px 12px}
  .when{text-align:left}
  .when strong{display:inline;margin-right:6px}
  #side{position:fixed;left:0;top:0;bottom:0;z-index:20;width:270px;flex-basis:270px;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  body.mini #side{width:270px}
  body.mini #side .lbl,body.mini #side .gname{display:revert}
  body.mini #side .gsep{display:none}
  body.drawer #side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  #side .minibtn{display:none}
  .mbar{display:flex;align-items:center;gap:6px;height:50px;padding:0 6px;background:var(--side);color:#fff}
  .mbar button,.mbar a{background:none;border:0;color:#fff;font:inherit;padding:8px 10px;cursor:pointer;display:flex;align-items:center;text-decoration:none}
  .mbar .t{flex:1;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mbar svg{width:22px;height:22px}
}
@media (prefers-reduced-motion:reduce){a.site::before,#side{transition:none}}
</style>
</head>
<body>

<!-- 홈 화면 -->
<div id="home">
  <header class="hero">
    <svg class="hero-bg" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F37321" stop-opacity=".28"/><stop offset="1" stop-color="#F37321" stop-opacity="0"/></linearGradient>
        <pattern id="gp" width="60" height="60" patternUnits="userSpaceOnUse"><path class="grid" d="M60 0H0V60" fill="none"/></pattern>
      </defs>
      <rect width="1200" height="520" fill="url(#gp)"/>
      <path class="area" d="M420 380 L500 362 L560 371 L630 330 L690 343 L760 288 L820 306 L880 252 L940 268 L1010 210 L1070 227 L1140 160 L1200 140 L1200 520 L420 520Z"/>
      <path class="line" d="M420 380 L500 362 L560 371 L630 330 L690 343 L760 288 L820 306 L880 252 L940 268 L1010 210 L1070 227 L1140 160"/>
      <circle class="dot" cx="1140" cy="160" r="6"/>
      <circle class="ring" cx="1140" cy="160" r="6"/>
    </svg>
    <div class="wrap hero-in">
      <div class="eyebrow">Private Banker · Market Intelligence</div>
      <h1><span class="sj">SJ</span> Market Desk</h1>
      <p class="lead"><b>승진 PB</b>의 투자 데스크 — 시장·수급·상품을 한곳에서</p>
      <ul class="stats">
        <li><span class="k">Sites</span><span class="v o" id="cnt">0</span></li>
        <li><span class="k">Categories</span><span class="v" id="gcnt">0</span></li>
        <li class="clock"><span class="k">Seoul · KST</span><span class="v" id="clock">--</span></li>
      </ul>
      <div class="searchrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input class="search" id="q" type="search" placeholder="사이트 이름으로 찾기 (예: 자사주)" aria-label="사이트 검색">
      </div>
    </div>
  </header>
  <div class="hero-edge"></div>
  <main class="wrap" id="main"></main>
  <div class="wrap"><p class="empty" id="empty">찾는 사이트가 없습니다. 다른 단어로 검색해 보세요.</p></div>
  <footer>
    <div class="wrap">
      <p>모든 사이트는 투자 참고용이며, 데이터 지연·오류가 있을 수 있습니다. 투자 판단의 최종 책임은 이용자에게 있습니다.</p>
      <p>bluelagoon1222.github.io</p>
    </div>
  </footer>
</div>

<!-- 사이트 보기 화면 -->
<div id="app" hidden>
  <nav id="side" aria-label="사이트 이동"></nav>
  <div class="view">
    <div class="mbar">
      <button id="menuBtn" aria-label="메뉴 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span class="t" id="mtitle"></span>
      <a href="#" aria-label="홈으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
    </div>
    <div class="loading" id="loading">불러오는 중…</div>
    <iframe id="fr" title="선택한 사이트"></iframe>
  </div>
</div>

<script>
// ▼ 사이트 추가·삭제는 이 목록만 고치면 됩니다 (repo = 깃허브 저장소 이름, 대소문자 그대로 / icon = 왼쪽 메뉴 아이콘)
const GROUPS = [
  { title:"시장 지도·심리", note:"오늘 시장이 어디로 쏠렸는지", sites:[
    { icon:"🗺️", name:"한국 히트맵", repo:"Finviz-Korea", desc:"KOSPI·KOSDAQ·ETF 섹터별 등락을 한눈에 보는 FINVIZ형 히트맵", when:"장중 30분 간격" },
    { icon:"🌡️", name:"공포·탐욕 CHECK", repo:"FearGreed-Korea", desc:"한국 공포·탐욕 지수, 미국 F&G, 한국 과열도 지수와 시장 폭", when:"매일" },
    { icon:"📅", name:"MARKET CALENDAR CHECK", repo:"Market-Calendar-Korea", desc:"한·미 실적발표, 지수변경, 휴장일, FOMC·금통위 일정 캘린더", when:"평일 07:40 · 17:50" }
  ]},
  { title:"수급·공시", note:"누가 사고 누가 파는지", sites:[
    { icon:"💼", name:"사모펀드 수급 CHECK", repo:"Samo-Flow-Korea", desc:"사모펀드 순매수·순매도 상위 종목과 종목별 일별 추이", when:"매일 (전일 기준)" },
    { icon:"🕵️", name:"내부자 매매 CHECK", repo:"Insider-Korea", desc:"임원·주요주주 장내매수·매도와 여러 명이 동시에 산 클러스터 매수", when:"매일" },
    { icon:"♻️", name:"자사주 CHECK", repo:"Buyback-Korea", desc:"자사주 취득·소각·처분, 밸류업 공시와 공시 후 주가 반응", when:"평일 08:30 · 19:30" },
    { icon:"⚖️", name:"지수 정기변경 CHECK", repo:"Index-Rebalance-Korea", desc:"KOSPI200·KOSDAQ150·반도체TOP10 편입·편출 예상 패시브 수급", when:"평일 08:20 · 18:40" }
  ]},
  { title:"상품", note:"고객 보유 상품 점검", sites:[
    { icon:"📈", name:"액티브 ETF CHECK", repo:"ActiveETF-Check", desc:"같은 섹터 액티브 ETF의 구성종목·비중 변화·성과 비교 (국내/해외)", when:"평일 08:50 외" },
    { icon:"🎯", name:"MIRAE ELS CHECK", repo:"MIRAE-ELS-CHECK", desc:"공모 ELS 회차를 입력하면 조기상환 가능일과 수익률 조회", when:"매일 배치" },
    { icon:"💰", name:"ETF 분배금 계산기", repo:"ETF-Dividend-Korea", desc:"국내 ETF 분배율·수익률 Top 30, 비율 입력 시 12개월 월별 분배금·과표 추정", when:"평일 08:00" }
  ]},
  { title:"미국", note:"미국 공시 데이터로 보는 테마", sites:[
    { icon:"🧱", name:"AI 백로그 레이더", repo:"AI-Backlog-Radar", desc:"AI 밸류체인 수주잔고(RPO)·일감 배수·하이퍼스케일러 설비투자 분기 추이", when:"평일 06:30" }
  ]}
];

const BASE = "https://bluelagoon1222.github.io/";
const HOME_TITLE = document.title;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ALL = GROUPS.flatMap(g => g.sites);
const $ = id => document.getElementById(id);

/* --- 홈 목록 --- */
GROUPS.forEach(g => {
  const sec = document.createElement("section");
  sec.innerHTML =
    `<div class="group-head"><h2>${esc(g.title)}</h2><span>${esc(g.note)}</span></div><div class="list">` +
    g.sites.map(s => {
      const key = (s.name + " " + s.repo + " " + s.desc).toLowerCase();
      return `<a class="site" href="#/${esc(s.repo)}" data-key="${esc(key)}">
        <div class="name"><span class="ico" aria-hidden="true">${s.icon}</span>${esc(s.name)}<span class="repo">/${esc(s.repo)}</span></div>
        <div class="desc">${esc(s.desc)}</div>
        <div class="when"><strong>갱신</strong>${esc(s.when)}</div></a>`;
    }).join("") + `</div>`;
  $("main").appendChild(sec);
});
$("cnt").textContent = ALL.length;
$("gcnt").textContent = GROUPS.length;
function tick(){
  const f = new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false});
  const o = Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
  $("clock").innerHTML = `${o.year}.${o.month}.${o.day} <small>(${o.weekday})</small> ${o.hour}:${o.minute}`;
}
tick(); setInterval(tick, 15000);

$("q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll("#main section").forEach(sec => {
    let n = 0;
    sec.querySelectorAll("a.site").forEach(a => {
      const hit = !q || a.dataset.key.includes(q);
      a.style.display = hit ? "" : "none";
      if (hit) n++;
    });
    sec.style.display = n ? "" : "none";
    shown += n;
  });
  $("empty").style.display = shown ? "none" : "block";
});

/* --- 왼쪽 메뉴 --- */
const HOME_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>`;
$("side").innerHTML =
  `<a class="homebtn" href="#" title="홈으로">${HOME_SVG}<span class="lbl"><span class="sj">SJ</span> Market Desk</span></a>` +
  GROUPS.map(g =>
    `<div class="gname">${esc(g.title)}</div><div class="gsep"></div>` +
    g.sites.map(s => `<a href="#/${esc(s.repo)}" data-repo="${esc(s.repo)}" title="${esc(s.name)}"><span class="ico" aria-hidden="true">${s.icon}</span><span class="lbl">${esc(s.name)}</span></a>`).join("")
  ).join("") +
  `<div class="bottom">
     <a id="newtab" href="#" target="_blank" rel="noopener" title="현재 사이트를 새 탭으로 열기"><span class="ico" aria-hidden="true">↗</span><span class="lbl">새 탭으로 열기</span></a>
     <button class="minibtn" id="miniBtn" title="메뉴 접기/펴기"><span class="ico" aria-hidden="true">⇤</span><span class="lbl">메뉴 접기</span></button>
   </div>`;

function setMini(on){
  document.body.classList.toggle("mini", on);
  $("miniBtn").querySelector(".ico").textContent = on ? "⇥" : "⇤";
  try { localStorage.setItem("hubMini", on ? "1" : "0"); } catch(e) {}
}
try { if (localStorage.getItem("hubMini") === "1") setMini(true); } catch(e) {}
$("miniBtn").addEventListener("click", () => setMini(!document.body.classList.contains("mini")));
$("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
$("side").addEventListener("click", e => { if (e.target.closest("a")) document.body.classList.remove("drawer"); });
document.addEventListener("click", e => {
  if (document.body.classList.contains("drawer") && !e.target.closest("#side") && !e.target.closest("#menuBtn"))
    document.body.classList.remove("drawer");
});

/* --- 화면 전환 (#/저장소이름) --- */
$("fr").addEventListener("load", () => { $("loading").hidden = true; });

function route(){
  const repo = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const site = ALL.find(s => s.repo.toLowerCase() === repo.toLowerCase());
  if (!site){
    $("app").hidden = true; $("home").hidden = false;
    document.body.style.overflow = "";
    document.title = HOME_TITLE;
    if ($("fr").getAttribute("src")) $("fr").removeAttribute("src");
    return;
  }
  const url = BASE + site.repo + "/";
  $("home").hidden = true; $("app").hidden = false;
  document.body.style.overflow = "hidden";
  if ($("fr").getAttribute("src") !== url){ $("loading").hidden = false; $("fr").setAttribute("src", url); }
  document.querySelectorAll("#side a[data-repo]").forEach(a => a.classList.toggle("on", a.dataset.repo === site.repo));
  $("newtab").href = url;
  $("mtitle").textContent = site.icon + " " + site.name;
  document.title = site.name + " · SJ Market Desk";
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
